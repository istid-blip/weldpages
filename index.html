<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Portal | Sveiseteknisk Presisjon</title>
    <style>
        /* Importerer lokal Geist Mono fra prosjektmappen */
        @font-face {
            font-family: 'Geist';
            src: local('Geist Medium'), local('Geist Medium'),
                 url('Geist-Medium.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Geist';
            src: local('Geist Bold'), local('Geist Bold'),
                 url('Geist-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Geist Mono';
            src: local('Geist Mono Regular'), local('Geist Mono'),
                 url('GeistMono-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Geist Mono';
            src: local('Geist Mono Medium'), local('Geist Mono'),
                 url('GeistMono-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-color: #000000;
            --main-color: #33FF4D; /* Retro Terminal Grønn */
            --dim-color: #004400;
            --font-stack: 'Geist Mono';
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: var(--font-stack);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* CRT / Scanline Effekt */
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            position: relative;
            z-index: 1;
        }

        /* Overskrifter og Tekst */
        h1, h2, h3 {
            text-transform: uppercase;
            letter-spacing: -1px;
            text-shadow: 0 0 1px var(--main-color);
        }
        
        p {
            line-height: 1.6;
            font-size: 1.1em;
        }

        .header-section {
            text-align: center;
            margin-bottom: 60px;
        }

        /* Den blinkende markøren for overskriften */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 0.35em;
            background-color: var(--main-color);
            vertical-align: baseline;
            animation: none;
            margin-left: -10px;
        }

        /* Layout for app-valg */
        .app-grid {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Retro App-kort */
        .app-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--main-color);
            border: 2px solid var(--dim-color);
            padding: 40px;
            border-radius: 8px;
            width: 220px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 0 5px var(--dim-color);
            background: transparent;
        }

        .app-card:hover {
            border-color: var(--main-color);
        }

        /* Logo CSS (Tilpasset for både Q og S) */
        .app-logo {
            --logo-size: 120px; 
            width: var(--logo-size);
            height: var(--logo-size);
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            position: relative;
        }

        .logo-row {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            transform: translateY(calc(var(--logo-size) * -0.015)); 
            position: relative;
        }

        .logo-letter {
            color: var(--main-color);
            font-family: 'Geist', sans-serif;
            font-size: calc(var(--logo-size) * 0.85); 
            font-weight: 700;
            line-height: 0.75;
            text-shadow: 0 0 calc(var(--logo-size) * 0.08) rgba(51, 255, 77, 0.8);
            margin-bottom: calc(var(--logo-size) * -0.05); 
        }

        .logo-cursor {
            width: calc(var(--logo-size) * 0.10);
            height: calc(var(--logo-size) * 0.15);
            background-color: var(--main-color);
            position: absolute;
            right: calc(var(--logo-size) * -0.08);
            bottom: calc(var(--logo-size) * -0.14);
            box-shadow: 0 0 calc(var(--logo-size) * 0.03) rgba(51, 255, 77, 0.8),
                        0 0 calc(var(--logo-size) * 0.06) rgba(51, 255, 77, 0.4);
            animation: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .app-card:hover .logo-cursor {
            animation: cursorBlink 1s step-end infinite;
            opacity: 1;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .btn {
            display: inline-block;
            background: transparent;
            color: var(--main-color);
            border: 2px solid var(--main-color);
            padding: 10px 20px;
            font-family: var(--font-stack);
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 0 5px var(--dim-color);
            margin-top: 20px;
        }

        .btn:hover {
            color: var(--main-color);
            box-shadow: 0 0 5px var(--dim-color);
        }

        footer {
            text-align: center;
            border-top: 1px dashed var(--dim-color);
            padding-top: 30px;
            margin-top: 80px;
            font-size: 0.9em;
        }
    </style>
</head>
<body class="crt">
    <div class="container">
        
        <header class="header-section">
            <h1 id="main-title">
                <span id="type-text"></span>
                <span class="cursor"></span>
            </h1>
            <p>Select application to proceed_</p>
        </header>

        <div class="app-grid">
            <!-- Heat Input App -->
            <a href="heat-input.html" class="app-card">
                <div class="app-logo">
                    <div class="logo-row">
                        <div class="logo-letter">Q</div>
                        <div class="logo-cursor"></div>
                    </div>
                </div>
                <h2>Heat Input</h2>
            </a>

            <!-- Schaeffler App -->
            <a href="schaeffler.html" class="app-card">
                <div class="app-logo">
                    <div class="logo-row">
                        <div class="logo-letter">S</div>
                        <div class="logo-cursor"></div>
                    </div>
                </div>
                <h2>Schaeffler</h2>
            </a>
        </div>

        <footer>
            <p>App Portal | © 2026 Frode Halrynjo</p>
        </footer>
    </div>

    <script>
        // Skrivemaskin-effekt for portalen
        const textElement = document.getElementById('type-text');
        const textToType = "> APP PORTAL";
        let i = 0;
        
        function typeWriter() {
            if (i < textToType.length) {
                textElement.textContent = textToType.substring(0, i + 1);
                i++;
                setTimeout(typeWriter, 100); 
            }
        }
        
        window.onload = typeWriter;
    </script>
</body>
</html>
